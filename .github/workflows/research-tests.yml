name: Research integrity tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project + test dependencies
        run: python -m pip install -e '.[dev,indicdb]'
      - name: Run unit and regression tests
        run: python -m pytest tests -q --tb=short --junitxml=pytest-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicsql-pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
